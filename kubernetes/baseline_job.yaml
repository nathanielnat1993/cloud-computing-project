apiVersion: batch/v1
kind: Job
metadata:
  name: baseline-job
  namespace: gp-engine-mizzou-dsa-cloud
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: baseline
        image: ghcr.io/nathanielnat1993/cloud-computing-project:v32
        imagePullPolicy: Always
        command: ["python", "/project/src/main.py", "--mode", "baseline", "--data_path", "/project/storage/data"]
        resources:
          requests:
            nvidia.com/gpu: 1
            cpu: "1"
            memory: "12Gi"
          limits:
            nvidia.com/gpu: 1
            cpu: "2"
            memory: "24Gi"
        volumeMounts:
        # CHANGED: Mount to /project/storage so we don't hide /project/src
        - mountPath: /project/storage
          name: project-storage
      volumes:
      - name: project-storage
        persistentVolumeClaim:
          claimName: naaxk6-pvc





