apiVersion: batch/v1
kind: Job
metadata:
  name: baseline-job
  namespace: gp-engine-mizzou-dsa-cloud
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: baseline
        image: ghcr.io/nathanielnat1993/cloud-computing-project:latest
        imagePullPolicy: Always
        command: ["python", "src/main.py", "--mode", "baseline"]
        resources:
          requests:
            nvidia.com/gpu: 1
            cpu: "1"
            memory: "12Gi"
          limits:
            nvidia.com/gpu: 1
            cpu: "2"
            memory: "24Gi"
        volumeMounts:
        - mountPath: /project/pvc
          name: project-storage
      volumes:
      - name: project-storage
        persistentVolumeClaim:
          claimName: naaxk6-pvc





